name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "coverage-upload-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("clis/coverage-upload/pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "coverage-upload-v${PACKAGE_VERSION}"

      - name: Build distributions
        run: python -m build clis/coverage-upload

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clis/coverage-upload/dist/
