          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: pre-function
        config:
          access:
            - |
              return kong.response.exit(501, {
                error = {
                  code = "service_not_implemented",
                  message = "This Vericov API surface is defined but not implemented yet"
                }
              }, {
                ["Content-Type"] = "application/json"
              })

  - name: public-api-block
    url: http://127.0.0.1:1
    routes:
      - name: public-api-block
        paths:
          - /api/v1
          - /webhooks
        strip_path: false
    plugins:
      - name: pre-function
        config:
          access:
            - |
              return kong.response.exit(404, {
                error = {
                  code = "not_found",
                  message = "Route not found"
                }
              }, {
                ["Content-Type"] = "application/json"
              })

  - name: internal-api-block
