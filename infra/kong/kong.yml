  - name: git-integration-service
    url: ${GIT_INTEGRATION_SERVICE_URL}
    connect_timeout: 5000
    read_timeout: 300000
    write_timeout: 300000
    routes:
      - name: git-api-v1
        paths:
          - /api/v1/git
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
      - name: git-webhooks
        paths:
          - /webhooks/github
          - /webhooks/gitlab
          - /webhooks/bitbucket
        methods:
          - POST
          - OPTIONS
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "${VERICOV_CORS_ORIGIN}"
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-GitHub-Delivery
            - X-GitHub-Event
            - X-Hub-Signature-256
            - X-Request-Id
          exposed_headers:
            - X-Request-Id
          credentials: false
          max_age: 3600
          preflight_continue: false
      - name: request-transformer
        config:
          remove:
            headers:
              - X-Vericov-User-Id
              - X-Vericov-User-Email
              - X-Vericov-Service-Name
              - X-Vericov-Service-Token
      - name: pre-function
        config:
          access:
            - |
              function require_github_webhook_headers()
                if kong.request.get_method() == "OPTIONS" then
                  return
                end

                local path = kong.request.get_path()
                if path:match("^/webhooks/github") == nil then
                  return
                end

                local delivery = kong.request.get_header("x-github-delivery")
                local event = kong.request.get_header("x-github-event")
                local signature = kong.request.get_header("x-hub-signature-256")
                if delivery == nil or event == nil or signature == nil then
                  return kong.response.exit(400, {
                    error = {
                      code = "gateway_validation_error",
                      message = "GitHub webhook delivery, event, and signature headers are required"
                    }
                  }, {
                    ["Content-Type"] = "application/json"
                  })
                end
              end

              require_github_webhook_headers()
      - name: rate-limiting
        config:
          minute: ${VERICOV_WEBHOOK_RATE_LIMIT_MINUTE}
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  - name: git-integration-internal-service
