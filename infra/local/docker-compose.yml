name: vericov-local

services:
  postgres-bundled:
    image: postgres:17-alpine
    profiles:
      - bundled-db
    environment:
      POSTGRES_DB: ${VERICOV_DB_NAME:-vericov}
      POSTGRES_USER: ${VERICOV_DB_USER:-vericov}
      POSTGRES_PASSWORD: ${VERICOV_DB_PASSWORD:-vericov}
    ports:
      - "127.0.0.1:${VERICOV_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-bundled-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - product

  upload:
    build:
      context: ../..
      dockerfile: infra/docker/helidon-service.Dockerfile
      args:
        SERVICE_DIR: services/upload
        SERVICE_JAR: upload.jar
    env_file:
      - ${VERICOV_COMPOSE_ENV_FILE:-.env}
    environment:
      VERICOV_UPLOAD_DB_URL: ${VERICOV_DB_URL:-jdbc:postgresql://postgres-bundled:5432/vericov}
      VERICOV_UPLOAD_DB_USER: ${VERICOV_DB_USER:-vericov}
      VERICOV_UPLOAD_DB_PASSWORD: ${VERICOV_DB_PASSWORD:-vericov}
      VERICOV_ARTIFACT_STORAGE_BACKEND: ${VERICOV_ARTIFACT_STORAGE_BACKEND:-supabase}
      VERICOV_SERVICE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${VERICOV_UPLOAD_HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - product

  coverage-analysis:
    build:
      context: ../..
      dockerfile: infra/docker/helidon-service.Dockerfile
      args:
        SERVICE_DIR: services/coverage-analysis
        SERVICE_JAR: coverage-analysis.jar
    env_file:
      - ${VERICOV_COMPOSE_ENV_FILE:-.env}
    environment:
      VERICOV_ANALYSIS_DB_URL: ${VERICOV_DB_URL:-jdbc:postgresql://postgres-bundled:5432/vericov}
      VERICOV_ANALYSIS_DB_USER: ${VERICOV_DB_USER:-vericov}
      VERICOV_ANALYSIS_DB_PASSWORD: ${VERICOV_DB_PASSWORD:-vericov}
      VERICOV_CONTROL_PLANE_BASE_URL: http://control-plane:8082
      VERICOV_GIT_BASE_URL: http://git-integration:8083
      VERICOV_SERVICE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${VERICOV_ANALYSIS_HTTP_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - product

  control-plane:
    build:
      context: ../..
      dockerfile: infra/docker/helidon-service.Dockerfile
      args:
        SERVICE_DIR: services/control-plane
        SERVICE_JAR: control-plane.jar
    env_file:
      - ${VERICOV_COMPOSE_ENV_FILE:-.env}
    environment:
      VERICOV_CONTROL_PLANE_DB_URL: ${VERICOV_DB_URL:-jdbc:postgresql://postgres-bundled:5432/vericov}
      VERICOV_CONTROL_PLANE_DB_USER: ${VERICOV_DB_USER:-vericov}
      VERICOV_CONTROL_PLANE_DB_PASSWORD: ${VERICOV_DB_PASSWORD:-vericov}
      VERICOV_SERVICE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${VERICOV_CONTROL_PLANE_HTTP_PORT:-8082}:8082"
      - "127.0.0.1:${VERICOV_CONTROL_PLANE_GRPC_PORT:-50082}:50082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - product

  git-integration:
    build:
      context: ../..
      dockerfile: infra/docker/helidon-service.Dockerfile
      args:
        SERVICE_DIR: services/git-integration
        SERVICE_JAR: git-integration.jar
    env_file:
      - ${VERICOV_COMPOSE_ENV_FILE:-.env}
    environment:
      VERICOV_DATABASE_URL: ${VERICOV_DB_URL:-jdbc:postgresql://postgres-bundled:5432/vericov}
      VERICOV_DATABASE_USER: ${VERICOV_DB_USER:-vericov}
      VERICOV_DATABASE_PASSWORD: ${VERICOV_DB_PASSWORD:-vericov}
      VERICOV_INTEGRATIONS_BASE_URL: http://integrations:8084
      VERICOV_SERVICE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${VERICOV_GIT_HTTP_PORT:-8083}:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - product

  integrations:
    build:
      context: ../..
      dockerfile: infra/docker/helidon-service.Dockerfile
      args:
        SERVICE_DIR: services/integrations
        SERVICE_JAR: integrations.jar
    env_file:
      - ${VERICOV_COMPOSE_ENV_FILE:-.env}
    environment:
      VERICOV_DATABASE_URL: ${VERICOV_DB_URL:-jdbc:postgresql://postgres-bundled:5432/vericov}
      VERICOV_DATABASE_USER: ${VERICOV_DB_USER:-vericov}
      VERICOV_DATABASE_PASSWORD: ${VERICOV_DB_PASSWORD:-vericov}
      VERICOV_SERVICE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${VERICOV_INTEGRATIONS_HTTP_PORT:-8084}:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - product

  agent-runner:
    build:
      context: ../..
      dockerfile: infra/docker/helidon-service.Dockerfile
      args:
        SERVICE_DIR: services/agent-runner
        SERVICE_JAR: agent-runner.jar
    env_file:
      - ${VERICOV_COMPOSE_ENV_FILE:-.env}
    environment:
      VERICOV_DATABASE_URL: ${VERICOV_DB_URL:-jdbc:postgresql://postgres-bundled:5432/vericov}
      VERICOV_DATABASE_USER: ${VERICOV_DB_USER:-vericov}
      VERICOV_DATABASE_PASSWORD: ${VERICOV_DB_PASSWORD:-vericov}
      VERICOV_SERVICE_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${VERICOV_AGENT_HTTP_PORT:-8085}:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - product

networks:
  product:

volumes:
  postgres-bundled-data:
