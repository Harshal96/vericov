[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vericov"
version = "0.0.3"
description = "Agentic coverage platform tooling."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Harshal Parekh" }
]
keywords = ["coverage", "testing", "ci", "agentic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing"
]

[project.urls]
Homepage = "https://github.com/Harshal96/vericov"
Repository = "https://github.com/Harshal96/vericov"
Issues = "https://github.com/Harshal96/vericov/issues"

[tool.setuptools.packages.find]
where = ["src"]
