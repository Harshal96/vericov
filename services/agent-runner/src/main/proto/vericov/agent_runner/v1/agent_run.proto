syntax = "proto3";

package vericov.agent_runner.v1;

option java_multiple_files = true;
option java_package = "dev.vericov.agent.grpc.v1";

service AgentRunService {
  rpc GetTask (GetTaskRequest) returns (AgentTask);
}

message GetTaskRequest {
  string task_id = 1;
}

message AgentTask {
  string task_id = 1;
  string repository_id = 2;
  string status = 3;
  string source = 4;
}
